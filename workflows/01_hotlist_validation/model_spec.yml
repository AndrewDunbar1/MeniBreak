id: hotlist-stability-v1
status: secondary_stability_union_sensitivity
historical_dynamic_auc_applicable: false
feature_manifest: ../../inst/extdata/hotlist_v1.csv
feature_value_used: boundary_count
panels_by_horizon:
  3_year: all_nine_manifest_features
  5_year: all_nine_manifest_features
  7_year: all_nine_manifest_features
presence_flags: descriptive_only
eligible_segment_events: [loss, gain, allelic_imbalance]
excluded_segment_events: [loh, neutral]
coordinate_system: arm-relative_telomere_to_centromere
interval_rule: left_closed_right_open
endpoints_years: [3, 5, 7]
primary_endpoint_years: 5
estimator:
  family: binomial
  method: elastic_net
  alpha: 0.25
  lambda: lambda.1se
  standardize: true
validation:
  outer_folds: 5
  repetitions: 10
  grouping: patient_id_or_sample_id
  inner_folds: 5
  imputation: training_fold_median
comparators:
  who_grade: recorded_numeric_ordinal_score
  integrated_grade: recorded_prespecified_numeric_ordinal_score
  evaluation: direct_auc_without_refitting
prohibited:
  - selecting new windows on the full validation cohort
  - tuning on outer test folds
  - recalculating an integrated-grade proxy
  - calling this a locked probability model
