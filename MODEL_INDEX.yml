schema_version: 1
authoritative: true
research_use_only: true
models:
  - id: dynamic-top8-v1
    order: 1
    label: Dynamic top-eight breakpoint procedure
    status: outcome-linked-fold-local-selection-recipe
    benchmark_status: fresh_execution_available_historical_six_auc_table_unverified
    input: event-called SEG plus explicit genome build
    implementation:
      extractor: extract_breakpoint_candidates
      cli: mbpr top8-candidates
      validation: workflows/01_dynamic_top8_validation/run_validation.py
      fresh_benchmark: inst/extdata/internal_breakpoint_only_benchmark_20260822.csv
      historical_benchmark: inst/extdata/historical_dynamic_top8_benchmark.csv
    parameters:
      bins_per_arm: 20
      minimum_support: 20
      selector: chi-square inside each outer training fold
      top_k: 8
      validation: five repeats of patient-grouped five-fold validation
      estimator: binomial elastic net, l1_ratio 0.25, C 0.1
    important_limit: Requires outcomes and refitting; it cannot score an outcome-free patient. The recovered historical AUC table is internally inconsistent with its methods and stability table.
  - id: scale-free-geometry-v1
    order: 2
    label: Scale-free breakpoint geometry
    status: exploratory-nested-validation-recipe
    benchmark_status: fresh_internal_execution_reproduced
    input: event-called SEG plus outcomes and explicit genome build
    parameters:
      features: 56 fixed normalized breakpoint shape and route-distribution summaries
      validation: ten repeats of patient-grouped five-fold validation
      estimator: binomial cv.glmnet, alpha 0.25, lambda.1se selected in inner patient-grouped folds
    implementation:
      workflow: workflows/02_scale_free_geometry_validation
      specification: workflows/02_scale_free_geometry_validation/model_spec.yml
      feature_lineage: archive/method-development/analysis/03_geometry_route_bakeoff.R
      validation: archive/method-development/analysis/04_scale_free_geometry_multihorizon.R
      benchmark: inst/extdata/internal_breakpoint_only_benchmark_20260822.csv
    important_limit: Strongest freshly reproduced breakpoint-only internal analysis, but exploratory and not a frozen external predictor.
  - id: hotlist-stability-v1
    order: 3
    label: Nine-window stability shortlist
    status: descriptive-external-replication-panel
    benchmark_status: feature_extraction_exact_dynamic_auc_not_applicable
    implementation:
      extractor: extract_hotlist_features
      cli: mbpr hotlist-extract
      validation: workflows/01_hotlist_validation/run_validation.R
      manifest: inst/extdata/hotlist_v1.csv
    important_limit: The nine rows are a cross-horizon stability union, not the top-eight fitted model.
  - id: who-grade-comparator
    order: 4
    label: Recorded WHO grade
    status: comparator
    implementation: Numeric recorded grade used directly as the discrimination score.
  - id: prespecified-integrated-grade-comparator
    order: 5
    label: Prespecified integrated grade
    status: comparator
    implementation: Numeric recorded clinical-data label; never recalculate a proxy.
  - id: clinical-hotlist-recipe
    order: 6
    label: Clinical covariates plus dynamic top-eight
    status: nested-validation-refit-recipe
    benchmark_status: requires_fresh_run_under_this_explicit_contract
    inputs: [age, log1p_mitoses, gtr, prior_rt, adj_rt, eight_fold_selected_binary_windows]
    implementation: docs/03_MODEL_RECIPES.md
  - id: clinical-scna-recipe
    order: 7
    label: Clinical covariates plus SCNA
    status: nested-validation-refit-recipe
    inputs: [age, log1p_mitoses, gtr, prior_rt, adj_rt, arm_level_scna]
    implementation: docs/03_MODEL_RECIPES.md
  - id: clinical-scna-breakpoint-recipe
    order: 8
    label: Clinical covariates plus SCNA plus breakpoint architecture
    status: nested-validation-refit-recipe
    inputs: [five_clinical_covariates, 39_arm_states, 18_breakpoint_architecture_features]
    implementation:
      specification: docs/03_MODEL_RECIPES.md
      lineage_script: archive/method-development/analysis/08_clinical_integrated_models.R
  - id: mbpr-derivation-v1
    order: 9
    label: Locked SEG-only SCNA-plus-breakpoint predictor
    status: locked-external-validation-model
    input: event-called SEG plus explicit genome build
    artifact: inst/models/mbpr-derivation-v1.rds
    registry: inst/models/registry.yml
    features: 44 SCNA plus 18 breakpoint architecture
    implementation:
      cli: mbpr score
      validation: mbpr validate
      specification: MODEL_CARD.md
archive:
  path: archive/method-development
  purpose: Full lineage implementations for geometry, compact-rule, BISCUT, TRISCUT, and sensitivity analyses.
  supported_primary_interface: false
