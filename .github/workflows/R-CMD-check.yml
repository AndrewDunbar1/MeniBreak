name: R package check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Repository data-hygiene audit
        run: ./tools/audit_no_phi.sh
      - name: Install check dependency
        run: Rscript -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
      - name: Smoke test
        run: R_PROFILE_USER=/dev/null Rscript tests/smoke.R
