schema_version: 1
model_id: scale-free-geometry-v1
research_use_only: true
status: exploratory_nested_validation_recipe
endpoint:
  horizons_years: [3, 5, 7]
  event: recurrence on or before horizon
  non_event: recurrence-free follow-up through horizon
  excluded: censoring before horizon
features:
  set_name: shape
  count: 56
  source: archive/method-development/analysis/03_geometry_route_bakeoff.R
  definition: normalized arm-relative breakpoint distribution and route-shape summaries
  excludes:
    - topology_suffix_features
    - complexity_and_fragmentation_features
    - clinical_covariates
    - thresholded_arm_scna_calls
validation:
  repetitions: 10
  outer_folds: 5
  outer_group: patient_id
  estimator: cv.glmnet binomial
  alpha: 0.25
  lambda: lambda.1se
  standardize: true
  inner_folds: 5
  inner_group: patient_id
  outer_seed_base: 20260803
  inner_seed_base: 20260806
aggregation: mean_auc_across_repetitions
restricted_analysis: subset broad-cohort out-of-fold predictions; never refit
benchmark: inst/extdata/internal_breakpoint_only_benchmark_20260822.csv
limitations:
  - internally developed and evaluated
  - not a frozen patient-level predictor
  - requires independent external validation
