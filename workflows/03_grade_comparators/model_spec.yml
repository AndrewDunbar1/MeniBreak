schema_version: 1
models:
  - model_id: who-grade-comparator
    score: numeric recorded WHO grade
    fit: none
  - model_id: prespecified-integrated-grade-comparator
    score: numeric recorded integrated-grade label
    fit: none
    forbidden: recalculation from a proxy formula
endpoint:
  horizons_years: [3, 5, 7]
  event: recurrence on or before horizon
  non_event: recurrence-free follow-up through horizon
  excluded: censoring before horizon
restricted_cohort:
  input: optional restricted_eligible binary flag
  fit: none
benchmark: ../../inst/extdata/internal_reproduced_model_benchmark_20260822.csv
